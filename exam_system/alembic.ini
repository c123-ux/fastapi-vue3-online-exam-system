# Alembic config. NOTE: keep this file ASCII-only.
# Alembic reads it with configparser(encoding="locale"); on a Chinese Windows that is GBK,
# so any Chinese comment here raises UnicodeDecodeError (hit for real on 2026-09-19).
# The database URL is resolved by alembic/env.py (env var ALEMBIC_DATABASE_URL > .env),
# so one migration chain serves both exam_db (dev) and exam_test (tests).
[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
